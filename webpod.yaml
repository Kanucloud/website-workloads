
apiVersion: apps/v1
kind: Deployment
metadata:
  name: elearning-deployment
  labels:
    app: new-elearning
spec:
  replicas: 3
  selector:
    matchLabels:
      app: new-elearning
  template:
    metadata:
      labels:
        app: new-elearning
    spec:
      containers:
      - name: elearning
        image: smartcloud2022/elearning:v1
        ports:
        - containerPort: 80
